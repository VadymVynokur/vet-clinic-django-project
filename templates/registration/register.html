{% extends "base.html" %}

{% block content %}
<h1>Create Veterinarian</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'login' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
