{% extends "base.html" %}

{% block content %}
<div class="col-md-4 offset-md-4">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
<p>
    Don’t have an account?
    <a href="{% url "accounts:register" %}">Register</a>
</p>
</div>
{% endblock %}
