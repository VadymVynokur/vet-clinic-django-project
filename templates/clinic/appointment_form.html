{% extends "base.html" %}

{% block content %}
<h1>{{ view.object.pk|yesno:"Update Appointment,Create Appointment" }}</h1>

    {% csrf_token %}
    {{ form.as_p }}
<button type="submit" class="btn btn-success">Save</button>

</form>
{% endblock %}
