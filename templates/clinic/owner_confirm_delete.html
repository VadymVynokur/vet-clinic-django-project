{% extends "base.html" %}

{% block content %}
<h1>Delete Owner</h1>
<p>Are you sure you want to delete {{ object.first_name }} {{ object.last_name }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'clinic:owner-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
