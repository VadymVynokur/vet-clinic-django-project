{% extends "base.html" %}

{% block content %}
<h1>Delete Service</h1>
<p>Are you sure you want to delete {{ object.service_type }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'clinic:service-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
