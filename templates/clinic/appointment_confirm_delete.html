{% extends "base.html" %}

{% block content %}
<h1>Delete Appointment</h1>
<p>Are you sure you want to delete this appointment for {{ appointment.pet.name }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'clinic:appointment-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
