<!DOCTYPE html>
<html lang="uk">
<head>
    {% block title %}<title>VetClinic</title>{% endblock %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

<header class="bg-dark text-light py-2">
    <div class="container-fluid">
        <div class="d-flex align-items-center justify-content-between">
            <div class="font-weight-bold">
                    🐾 VetClinic
            </div>
        </div>
    </div>
</header>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-2 bg-light min-vh-100 p-3">
            {% include "includes/sidebar.html" %}
        </aside>

        <main class="col-md-7 pt-3">
            {% block content %}{% endblock %}
            {% block pagination %}
                {% include "includes/pagination.html" %}
            {% endblock %}
        </main>

        <aside class="col-md-3 bg-light pt-3 p-3">
            {% block action_panel %}{% endblock %}
        </aside>

    </div>
</div>

</body>
</html>
